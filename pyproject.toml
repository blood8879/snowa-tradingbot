[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snowa-tradingbot"
version = "0.1.0"
description = "CANSLIM × Turtle Trading Hybrid Automated Trading Bot"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "aiohttp>=3.9",
    "websockets>=12.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2.30",
    "structlog>=24.0",
    "apscheduler>=3.10",
    "python-telegram-bot>=20.0",
    "aiosqlite>=0.19",
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.2",
    "mypy>=1.8",
]

[project.scripts]
snowa-bot = "scripts.run_bot:main"

[tool.setuptools.packages.find]
include = [
    "config*",
    "core*",
    "broker*",
    "data*",
    "screening*",
    "strategy*",
    "portfolio*",
    "bot*",
    "notifications*",
    "web*",
    "scripts*",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
